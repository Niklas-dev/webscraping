########################################################
# creates postgres sql database image and pgadmin4 image
# login db: postgres:postgres hostname: postgres
# login pgadmin: admin@developer-blog.net:admin port 5555
########################################################
version: "1"
services:
  postgres:
    image: postgres
    container_name: webscraping-postgres

    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webscraping-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: webscraping-pgadmin
    depends_on:
      - postgres
    ports:
      - 5555:80
    environment:
      PGADMIN_DEFAULT_EMAIL: test@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    restart: unless-stopped

  redis:
    image: redis:6.2-alpine
    container_name: "redis"
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass yourpassword --save 20 1 #--loglevel warning 
    volumes:
      - redis:/data

  celery_worker:
    container_name: celery_worker
    build: .
    working_dir: /app/backend/
    command: celery -A celery_setup worker --pool=solo --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
  flower:
    container_name: flower
    build: .
    command: celery -A backend flower --port=5556
    ports:
      - 5556:5556
    depends_on:
      - postgres
      - redis
      - celery_worker



volumes:
  postgres-data:
  redis:
